<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nucleolis micro mark. Simplified for small sizes: petals, one orbit,
       solid nucleus. The full two-orbit mark turns to mush below 32px. -->
  <rect width="64" height="64" rx="13" fill="#0f1f2b"/>
  <g fill="#d6eef0" fill-opacity="0.26">
    <circle cx="32" cy="22.5" r="14.5"/>
    <circle cx="41.0" cy="29.1" r="14.5"/>
    <circle cx="37.6" cy="39.6" r="14.5"/>
    <circle cx="26.4" cy="39.6" r="14.5"/>
    <circle cx="23.0" cy="29.1" r="14.5"/>
  </g>
  <ellipse cx="32" cy="32" rx="25" ry="10.5" transform="rotate(28 32 32)"
           fill="none" stroke="#9fb3c2" stroke-opacity="0.9" stroke-width="1.7"/>
  <circle cx="10.3" cy="43.6" r="2.8" fill="#d6eef0"/>
  <circle cx="53.7" cy="20.4" r="2.8" fill="#d6eef0"/>
  <circle cx="32" cy="32" r="9.6" fill="#0f1f2b"/>
  <circle cx="32" cy="32" r="7.8" fill="#f8fafc"/>
</svg>
