[project]
name = "nucleolus"
version = "0.1.0"
description = "Evidence-first literature research tool for ALS/FTD mechanisms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "openai>=1.68,<3",
    "anthropic>=0.84,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
bel = ["pybel>=0.15.5,<0.16", "indra>=1.24,<2", "setuptools>=70,<81"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nucleolus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
